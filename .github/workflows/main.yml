name: Namma Malige Bot Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.1.1
      with:
        token: ${{ secrets.GH_PAT }}
        submodules: false

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set Bot Status: SCRAPING
      run: |
        python tools/set_bot_status.py SCRAPING
        echo "✅ Bot status set to SCRAPING"

    - name: Pre-Run Safety
      run: |
        # 🔒 KEEP PERMANENT DEDUPLICATION CACHE ACROSS RUNS!
        # Only initialize DB if it doesn't exist yet!
        python -c "from bot import init_db; init_db(); print('✅ DB ready with PERMANENT deduplication!')"
        
        [ -f deals.json ] || echo "[]" > deals.json
        [ -f click_logs.csv ] || echo "timestamp,url,user_id,category" > click_logs.csv
        [ -f analytics.json ] || echo "{}" > analytics.json
        mkdir -p dashboard-new/public/data data
        [ -f data/master_log.csv ] || printf "timestamp,source,title,price,original_price,category,decision,reason,affiliate_valid\n" > data/master_log.csv
        [ -f dashboard-new/public/data/delivery_audit.csv ] || printf "timestamp,channel,status,deal_id\n" > dashboard-new/public/data/delivery_audit.csv
        [ -f dashboard-new/public/data/broadcast_log.csv ] || printf "timestamp,deal_id,recipients\n" > dashboard-new/public/data/broadcast_log.csv
        [ -f dashboard-new/public/data/subscribers.txt ] || printf "# one email per line\n" > dashboard-new/public/data/subscribers.txt
        [ -f dashboard-new/public/data/deals.json ] || echo "[]" > dashboard-new/public/data/deals.json
        [ -f dashboard-new/public/data/stats.json ] || echo "{}" > dashboard-new/public/data/stats.json
        [ -f dashboard-new/public/data/categories.json ] || echo "[]" > dashboard-new/public/data/categories.json
        [ -f dashboard-new/public/data/heatmap.json ] || echo "{}" > dashboard-new/public/data/heatmap.json
        [ -f dashboard-new/public/data/subscribers_recent.json ] || echo "[]" > dashboard-new/public/data/subscribers_recent.json
        touch rejection_audit.log heartbeat.timestamp trust_decay.json cache.json sale_followup_cache.json

    - name: Run Arbitrage Bot
      env:
        EARNKARO_API_KEY: ${{ secrets.EARNKARO_API_KEY }}
        EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
        EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        FLIPKART_TAG: ${{ secrets.FLIPKART_TAG }}
        GITHUB_ACTIONS: "true"
      run: |
        python main.py || true  # Continue even if bot has errors
        echo "✅ Bot execution completed"

    - name: Generate Dashboard Data
      run: |
        python tools/generate_dashboard_data.py || true
        echo "✅ Dashboard data generated"

    - name: Sync with origin/main
      run: |
        git fetch origin main
        git rebase origin/main || (git rebase --abort || true; git reset --hard origin/main)

    - name: Git Identity Configuration
      run: |
        git config --global user.name 'Namma-Malige-Bot'
        git config --global user.email 'bot@noreply.github.com'

    - name: Commit and Push Data Artifacts
      uses: stefanzweifel/git-auto-commit-action@v5
      continue-on-error: true
      with:
        commit_message: "Telemetry Update: Namma Malige Data Sync [skip ci]"
        file_pattern: '*.json *.csv *.db *.timestamp dashboard-new/public/data/*.json dashboard-new/public/data/*.csv dashboard-new/public/data/*.txt data/master_log.csv'
        skip_dirty_check: false
        skip_fetch: true
        status_options: '--untracked-files=no'
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    - name: Set Bot Status: SLEEPING
      if: always()  # ALWAYS run this, even if previous steps fail!
      run: |
        python tools/set_bot_status.py SLEEPING
        echo "✅ Bot status set to SLEEPING"


