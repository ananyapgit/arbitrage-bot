name: Arbitrage Bot Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.1.1
      with:
        token: ${{ secrets.GH_PAT }} # Needed for pushing changes (dashboard live sync)
        submodules: false # Explicitly disable submodules to prevent crash

    - name: Set up Node.js (for actions)
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Debug Python Version
      run: python --version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Pre-Run Safety (Smart Initialization)
      run: |
        [ -f deals.json ] || echo "[]" > deals.json
        [ -f click_logs.csv ] || echo "timestamp,url,user_id,category" > click_logs.csv
        [ -f analytics.json ] || echo "{}" > analytics.json
        mkdir -p dashboard/public/data data
        [ -f data/master_log.csv ] || printf "timestamp,source,title,price,original_price,category,decision,reason,affiliate_valid\n" > data/master_log.csv
        [ -f dashboard/public/data/delivery_audit.csv ] || printf "timestamp,channel,status,deal_id\n" > dashboard/public/data/delivery_audit.csv
        [ -f dashboard/public/data/broadcast_log.csv ] || printf "timestamp,deal_id,recipients\n" > dashboard/public/data/broadcast_log.csv
        [ -f dashboard/public/data/subscribers.txt ] || printf "# one email per line\n" > dashboard/public/data/subscribers.txt
        touch rejection_audit.log heartbeat.timestamp trust_decay.json cache.json sale_followup_cache.json

    - name: Run Arbitrage Bot (Single Cycle)
      env:
        # Required secrets (bridge into runtime env)
        EARNKARO_API_KEY: ${{ secrets.EARNKARO_API_KEY }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
        AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        # Legacy names kept for backward compatibility with existing code/config
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        FLIPKART_TAG: ${{ secrets.FLIPKART_TAG }}
        GITHUB_ACTIONS: "true"
      run: python main.py



    - name: Sync with origin/main (avoid non-fast-forward)
      run: |
        git fetch origin main
        git rebase origin/main || (git rebase --abort || true; git reset --hard origin/main)

    - name: Git Identity Configuration
      run: |
        git config --global user.name 'ArbiDeals-Bot-Automation'
        git config --global user.email 'bot@noreply.github.com'

    - name: Commit and Push Data Artifacts
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 Auto-Update: Bot Logs, Data & Stats [skip ci]"
        file_pattern: "click_logs.csv deals.json trust_decay.json rejection_audit.log analytics.json cache.json sale_followup_cache.json heartbeat.timestamp sendgrid_notifier.py data/master_log.csv dashboard/public/data/delivery_audit.csv dashboard/public/data/broadcast_log.csv dashboard/public/data/subscribers.txt heartbeat.json sent_deals.db"
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    - name: Trigger Next Run (5-Minute Loop)
      if: always()
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        echo "Attempting to trigger next run..."
        if [ -z "$GH_PAT" ]; then
          echo "ERROR: GH_PAT secret is missing. Cannot trigger next run."
          exit 1
        fi
        
        # Wait 5 minutes to stay within rate limits and maintain interval
        echo "Waiting 300 seconds..."
        sleep 300
        
        RESPONSE=$(curl -s -w "%{http_code}" -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot_runner.yml/dispatches" \
          -d '{"ref":"main"}')
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -c 3)
        echo "GitHub API Response Code: $HTTP_CODE"
        
        if [ "$HTTP_CODE" -eq 204 ]; then
          echo "Success: Next run triggered."
        else
          echo "Error: Failed to trigger next run (HTTP $HTTP_CODE)."
          echo "Response: $(echo "$RESPONSE" | head -c -3)"
          exit 1
        fi
