name: Arbitrage Bot Runner

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.1.1
      with:
        token: ${{ secrets.GH_PAT }} # Needed for pushing changes (dashboard live sync)
        submodules: false # Explicitly disable submodules to prevent crash

    - name: Set up Node.js (for actions)
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Debug Python Version
      run: python --version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Pre-Run Safety (Smart Initialization)
      run: |
        [ -f deals.json ] || echo "[]" > deals.json
        [ -f click_logs.csv ] || echo "timestamp,url,user_id,category" > click_logs.csv
        [ -f analytics.json ] || echo "{}" > analytics.json
        touch rejection_audit.log heartbeat.timestamp trust_decay.json cache.json sale_followup_cache.json

    - name: Run Arbitrage Bot (Single Cycle)
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        FLIPKART_TAG: ${{ secrets.FLIPKART_TAG }}
        GITHUB_ACTIONS: "true"
        # Add other secrets as needed
      run: python main.py



    - name: Git Identity Configuration
      run: |
        git config --global user.name 'ArbiDeals-Bot-Automation'
        git config --global user.email 'bot@noreply.github.com'

    - name: Commit and Push Data Artifacts
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 Auto-Update: Bot Logs, Data & Stats [skip ci]"
        file_pattern: "click_logs.csv deals.json trust_decay.json rejection_audit.log analytics.json cache.json sale_followup_cache.json heartbeat.timestamp dashboard/public/data/master_log.csv heartbeat.json sent_deals.db"
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    - name: Trigger Next Run (5-Minute Loop)
      if: always()
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        echo "Waiting 5 minutes before triggering the next run..."
        sleep 300
        curl -X POST \
          -H "Authorization: token $GH_PAT" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot_runner.yml/dispatches \
          -d '{"ref":"main"}'
